name: 'Print Info'
description: 'Prints environment and greeting info'
inputs:
  greeting:
    description: 'The message to print'
    required: true
  farewell:
    description: 'Need to say goodbye?'
    required: false
    default: 'Goodbye from the composite action!'
runs:
  using: "composite"
  steps:
    - name: Print greeting
      shell: bash
      run: |
        echo "${{ inputs.greeting }}"

    - name: Print runner info
      shell: bash
      run: |
        echo "OS: ${{ runner.os }}"
        echo "Date: $(date)"